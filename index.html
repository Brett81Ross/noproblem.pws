<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No Problem Pressure Washing Matrix</title>
<style>
html,body{margin:0;background:linear-gradient(135deg,#020617,#0b132b,#000);background-size:400% 400%;
animation:bg 20s ease infinite;color:#fff;font-family:Arial,sans-serif}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.container{max-width:1100px;margin:auto;padding:24px}
.card{background:rgba(12,18,30,.82);border:1px solid #00e5ff33;border-radius:16px;padding:20px;margin:18px 0;
box-shadow:0 0 18px #00e5ff22}
h1{color:#7ef9ff;text-align:center}
button{padding:12px 18px;border-radius:10px;border:none;background:#00bcd4;color:#fff;font-weight:bold;margin:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tier{padding:12px;border:1px solid #00e5ff33;border-radius:12px}
.footer{text-align:center;opacity:.7;margin:40px 0}
#log{white-space:pre-line;color:#8ff}
</style>
</head>
<body>
<div class="container">
<h1>No Problem Pressure Washing Matrix</h1>

<div class="card">
<h2>Project Photos</h2>
<input type="file" multiple accept="image/*">
<div>
<button onclick="scan()">Execute Matrix Scan</button>
</div>
<div id="log"></div>
</div>

<div class="card">
<h2>Proposal Engine</h2>
<div class="grid">
<div class="tier"><h3>Good</h3><p>Essential cleaning package.</p></div>
<div class="tier"><h3>Better</h3><p>Most popular package.</p></div>
<div class="tier"><h3>Best</h3><p>Premium restoration package.</p></div>
</div>
<h2>Total: <span id="total">$299.99</span></h2>
<button>Copy Proposal</button>
<button>Export PDF</button>
<button>Email Proposal</button>
</div>

<div class="card">
<h2>Scan Credits</h2>
<button>Buy 1 Scan Credit</button>
<button>Lifetime Access ($99)</button>
</div>

<div class="footer">
© 2026 No Problem Pressure Washing Solutions LLC • Powered by Cactus🌵Byte Studios™
</div>
</div>

<script>
const msgs=[
"CONNECTING TO IMAGING SCANNER MATRIX...",
"EXECUTING PIXEL RASTER SCAN ON STRUCTURE...",
"COMPUTING IMPLIED BOUNDING BOX MATRICES...",
"DETECTING SUBSTRATE GRIME SEVERITY COEFFICIENT...",
"CALCULATING METRIC MULTIPLIERS BY AREA...",
"ENFORCING STRICT OKLAHOMA CITY REGIONAL BASE RATES...",
"FINALIZING MULTI-TIER PROPOSAL ENGINE SPECIFICATIONS..."
];
async function scan(){
 const log=document.getElementById('log');
 log.textContent="";
 for(const m of msgs){
   log.textContent+=m+"\n";
   await new Promise(r=>setTimeout(r,700));
 }
 log.textContent+="\nSCAN COMPLETE.";
}
</script>
</body>
</html>
