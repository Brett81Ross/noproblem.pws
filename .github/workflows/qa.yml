name: Matrix QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'abl-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA tests
        run: npm test
