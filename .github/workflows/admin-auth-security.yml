name: No Problem Admin Auth Security

on:
  pull_request:
    paths:
      - 'api/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/admin-auth-security.yml'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
