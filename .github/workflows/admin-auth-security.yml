name: No Problem Admin Auth Security

on:
  pull_request:
    paths:
      - 'api/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/admin-auth-security.yml'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check security handlers
        run: |
          node --check api/_auth.js
          node --check api/admin-auth.js
          node --check api/secure-analyze.js
          node --check api/_cactusbyte-id.js
          node --check api/pro-status.js
          node --check api/stripe-webhook.js
          node --check api/demo-shell.js
      - run: npm run test:security
