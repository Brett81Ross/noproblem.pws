name: Standardize footer

on:
  push:
    paths:
      - .github/workflows/standardize-footer.yml

permissions:
  contents: write

jobs:
  patch-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch footer only
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'index.html';
            let s = fs.readFileSync(path, 'utf8');

            const oldCss = `.footer { width: 100%; margin-top: auto; margin-bottom: 10px; padding-top: 40px; font-size: 11px; color: #64748b; text-align: center; opacity: 0.65; line-height: 1.6; letter-spacing: 0.5px; }`;
            const newCss = `.footer { width: 100%; margin-top: auto; margin-bottom: 10px; padding: 18px 8px 4px; border-top: 1px solid rgba(0, 240, 255, 0.18); font-size: 11px; color: #64748b; text-align: center; opacity: 0.9; line-height: 1.65; box-sizing: border-box; } .footer strong { color: #00f0ff; font-weight: 800; }`;
            if (s.includes(oldCss)) s = s.replace(oldCss, newCss);

            const oldFooter = `        <div class="footer">\n            &copy; 2026 No Problem Pressure Washing Matrix&trade;<br>\n            Powered by Cactus🌵Byte Studios&trade;<br>\n            All Rights Reserved\n        </div>`;
            const newFooter = `        <div class="footer" id="cactusbyte-standard-footer">\n            <div>© 2026 No Problem Pressure Washing Matrix™</div>\n            <div>Powered by <strong>Cactus🌵Byte Studios™</strong> · All Rights Reserved</div>\n        </div>`;
            if (!s.includes(oldFooter)) core.setFailed('Expected footer block not found; refusing to alter unrelated code.');
            else {
              s = s.replace(oldFooter, newFooter);
              fs.writeFileSync(path, s, 'utf8');
            }

      - name: Commit footer only
        shell: bash
        run: |
          git config user.name "CactusByte Footer Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize CactusByte footer"
          git push
